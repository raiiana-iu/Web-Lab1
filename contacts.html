<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Contact</title>
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h2>Contact Purrfect Paws</h2>
            <p>Have a question about one of our cats? Want to learn more about adoption? Send us a message and our team will be happy to help.</p>
            <form>
                <fieldset>
                    <legend>Tell Us About Yourself</legend>
                    <label for="name">Your name:</label>
                    <input type="textl"id="name"name="name">
                    <label for="mail">Your mail:</label>
                    <input type="email"id="mail"name="mail">
                    <label for="visit-day">Preferred visit day:</label>
                    <input type="date"id="visit-day"name="visit-day">
                    <label for="interested-in">What are you interested in?</label>
                    <select name="interest" id="interested-in">
                    <option value="adoption">Adopting a cat</option>
                    <option value="learning">Learning about our cats</option>
                    <option value="visit">Visiting the shop</option>
                    <option value="other">Other</option>
                    </select>
                    <label for="message">Your message</label>
                    <textarea name="message" id="message">...</textarea>
                    <button type="submit">Submit</button>
                </fieldset>
            </form>
            
        </main>
    </body>
</html>
